<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500" role="img" aria-label="Risk-Switch Lite-GLOBE-P+ 전체 연구 시각화">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="58%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f7fbf4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#f97316"/>
    </marker>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:58px;font-weight:800;fill:#0f172a}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:25px;font-weight:500;fill:#475569}
      .section{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:28px;font-weight:800;fill:#0f172a}
      .h3{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:23px;font-weight:800;fill:#111827}
      .body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:18px;font-weight:500;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:15px;font-weight:500;fill:#475569}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:13px;font-weight:600;fill:#64748b}
      .formula{font-family:"SF Mono","Menlo","Consolas","DejaVu Sans Mono",monospace;font-size:18px;font-weight:650;fill:#172554}
      .formulaSmall{font-family:"SF Mono","Menlo","Consolas","DejaVu Sans Mono",monospace;font-size:15px;font-weight:650;fill:#1e1b4b}
      .card{fill:#ffffff;stroke:#dbeafe;stroke-width:2;filter:url(#shadow)}
      .softCard{fill:#f8fafc;stroke:#e2e8f0;stroke-width:2}
      .blueText{fill:#2563eb}.greenText{fill:#059669}.orangeText{fill:#ea580c}.redText{fill:#e11d48}.purpleText{fill:#7c3aed}
      .link{stroke:#94a3b8;stroke-width:4;stroke-dasharray:8 8;fill:none}
      .strongLink{stroke:#2563eb;stroke-width:6;fill:none}
      .weakLink{stroke:#ef4444;stroke-width:5;stroke-dasharray:12 10;fill:none}
    </style>
    <symbol id="drone" viewBox="0 0 120 120">
      <line x1="60" y1="60" x2="25" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="95" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="25" y2="95" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="95" y2="95" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="18" fill="#2563eb" stroke="#eff6ff" stroke-width="5"/>
      <ellipse cx="25" cy="25" rx="20" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
      <ellipse cx="95" cy="25" rx="20" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
      <ellipse cx="25" cy="95" rx="20" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
      <ellipse cx="95" cy="95" rx="20" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
    </symbol>
  </defs>

  <rect width="1800" height="2500" fill="url(#bg)"/>

  <rect x="70" y="52" width="1660" height="210" rx="38" fill="#ffffff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="132" class="title">Risk-Switch Lite-GLOBE-P+ 전체 구조</text>
  <text x="116" y="179" class="subtitle">UAV/FANET 라우팅: 전역 Teacher는 학습에만 사용하고, 실제 UAV는 1-hop 지역 정보만으로 안전한 next-hop을 선택</text>
  <g transform="translate(1450,70) scale(1.55)">
    <use href="#drone" width="120" height="120"/>
  </g>
  <rect x="112" y="206" width="255" height="36" rx="18" fill="#dbeafe"/>
  <text x="138" y="230" class="tiny blueText">RL-trained Global Teacher</text>
  <rect x="386" y="206" width="230" height="36" rx="18" fill="#ede9fe"/>
  <text x="419" y="230" class="tiny purpleText">KD / KL Distillation</text>
  <rect x="636" y="206" width="270" height="36" rx="18" fill="#dcfce7"/>
  <text x="664" y="230" class="tiny greenText">Local Risk-Switch Student</text>
  <rect x="926" y="206" width="215" height="36" rx="18" fill="#ffedd5"/>
  <text x="958" y="230" class="tiny orangeText">Phase12 Full Evidence</text>

  <!-- Row 1: simulation and training -->
  <rect x="70" y="310" width="790" height="640" rx="34" class="card"/>
  <text x="108" y="360" class="section">1. 시뮬레이션 문제: 움직이는 UAV 그래프</text>
  <text x="110" y="397" class="body">각 시간 t마다 링크가 바뀌고, 현재 패킷 보유 노드는 1-hop 이웃 또는 DROP 중 하나를 선택한다.</text>
  <rect x="110" y="430" width="710" height="395" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M210 640 C330 470, 475 720, 620 505" class="link"/>
  <path d="M210 640 C360 610, 520 590, 700 650" class="strongLink"/>
  <path d="M620 505 C665 532, 704 588, 700 650" class="weakLink"/>
  <path d="M360 522 C456 485, 540 466, 620 505" class="link"/>
  <path d="M360 522 C470 615, 580 670, 700 650" class="link"/>
  <circle cx="210" cy="640" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="190" y="647" class="h3 blueText">S</text>
  <g transform="translate(315,466) scale(.75)"><use href="#drone" width="120" height="120"/></g>
  <g transform="translate(575,450) scale(.75)"><use href="#drone" width="120" height="120"/></g>
  <g transform="translate(655,595) scale(.75)"><use href="#drone" width="120" height="120"/></g>
  <g transform="translate(455,610) scale(.65)"><use href="#drone" width="120" height="120"/></g>
  <circle cx="770" cy="500" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="748" y="508" class="h3 greenText">D</text>
  <text x="145" y="783" class="small">파란 실선: 선택된 안정 경로</text>
  <text x="403" y="783" class="small">빨간 점선: 곧 끊길 수 있는 위험 링크</text>
  <text x="146" y="867" class="formula">G_t=(V,E_t),   A(u_t)=N_t(u_t) ∪ {DROP}</text>
  <text x="146" y="907" class="small">목표: PDR·deadline은 높이고, delay·energy·input bytes는 낮추기</text>

  <rect x="940" y="310" width="790" height="640" rx="34" class="card"/>
  <text x="978" y="360" class="section">2. 학습 단계: Global Teacher → Local Student</text>
  <text x="980" y="397" class="body">Teacher는 전체 그래프를 보는 privileged 정책이고, Student는 그 판단을 지역 관측으로 모방한다.</text>
  <rect x="990" y="456" width="210" height="180" rx="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1022" y="500" class="h3 blueText">Global Teacher</text>
  <text x="1024" y="535" class="small">PPO Actor-Critic</text>
  <text x="1024" y="566" class="small">전체 그래프 관측</text>
  <text x="1024" y="597" class="small">routing utility 학습</text>

  <rect x="1258" y="456" width="210" height="180" rx="26" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1320" y="500" class="h3 purpleText">KD / KL</text>
  <text x="1287" y="535" class="small">Teacher logits</text>
  <text x="1287" y="566" class="small">후보별 선호도</text>
  <text x="1287" y="597" class="small">분포 차이 최소화</text>

  <rect x="1520" y="456" width="170" height="180" rx="26" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
  <text x="1547" y="500" class="h3 greenText">Student</text>
  <text x="1545" y="535" class="small">1-hop 관측</text>
  <text x="1545" y="566" class="small">지역 실행</text>
  <text x="1545" y="597" class="small">경량 정책</text>
  <path d="M1208 546 L1248 546" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1475 546 L1510 546" stroke="#059669" stroke-width="6" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="995" y="690" width="690" height="180" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1027" y="733" class="formula">Teacher RL:   π_T(a | global graph, destination)</text>
  <text x="1027" y="778" class="formula">KD loss:      L_KD = T² · KL(softmax(z_T/T) || softmax(z_S/T))</text>
  <text x="1027" y="823" class="formula">Student:      π_S(a | local obs, destination)</text>
  <text x="1027" y="859" class="small">핵심: 강화학습은 Teacher 학습에 있고, 실제 UAV 실행은 Student + risk-switch 규칙으로 수행된다.</text>

  <!-- Row 2: local execution and formulas -->
  <rect x="70" y="1000" width="790" height="680" rx="34" class="card"/>
  <text x="108" y="1050" class="section">3. 실행 단계: 각 UAV가 보는 지역 정보</text>
  <text x="110" y="1087" class="body">현재 노드는 후보 이웃 i마다 목적지 진행도, 링크 안정성, 다음 홉 이후 경로 가능성을 계산한다.</text>
  <g transform="translate(140,1145) scale(.9)"><use href="#drone" width="120" height="120"/></g>
  <circle cx="300" cy="1212" r="112" fill="none" stroke="#93c5fd" stroke-width="5" stroke-dasharray="10 10"/>
  <text x="228" y="1350" class="small">현재 노드 u</text>
  <g transform="translate(390,1130) scale(.58)"><use href="#drone" width="120" height="120"/></g>
  <g transform="translate(560,1172) scale(.58)"><use href="#drone" width="120" height="120"/></g>
  <g transform="translate(445,1325) scale(.58)"><use href="#drone" width="120" height="120"/></g>
  <path d="M265 1210 L438 1190" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M265 1210 L604 1230" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M265 1210 L492 1388" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="110" y="1452" width="710" height="166" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="142" y="1494" class="h3 blueText">후보별 local feature</text>
  <text x="144" y="1532" class="formulaSmall">x_i^risk = [m_i, ℓ_i, q_i, o_i]</text>
  <text x="144" y="1565" class="small">m: 링크 여유, ℓ: 링크 수명, q: 큐 여유, o: 다음 hop 이후 best link 수명</text>
  <text x="144" y="1598" class="formulaSmall">x_i^plus = [ō_i,topk, ρ_i, p_keep, η_i]</text>
  <text x="144" y="1631" class="small">top-k 안정성, 경로 중복성, 링크 유지확률, 에너지 효율을 추가로 반영</text>

  <rect x="940" y="1000" width="790" height="680" rx="34" class="card"/>
  <text x="978" y="1050" class="section">4. 후보 점수식: 가까운가 + 오래 버티는가</text>
  <text x="980" y="1087" class="body">GPSR식 목적지 진행도에 link lifetime, onward stability, teacher residual을 결합한다.</text>
  <rect x="990" y="1140" width="690" height="180" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1022" y="1184" class="h3 blueText">Predictive Geographic Prior</text>
  <text x="1022" y="1232" class="formula">S_PG(j)=w_pP_j+w_fF_j+w_mM_j+w_lL_j+w_qQ_j+w_oO_j</text>
  <text x="1024" y="1274" class="small">P: 목적지 진행도, F: forwarding 가능성, M/L: 링크 여유·수명, Q: 큐 여유, O: onward 수명</text>
  <rect x="990" y="1360" width="690" height="260" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="1022" y="1404" class="h3 orangeText">최종 next-hop logit</text>
  <text x="1022" y="1454" class="formula">z_j = S_PG(j) + λ_r B·tanh(g_θ(o,j)) - λ_p G(j)</text>
  <text x="1022" y="1500" class="formulaSmall">G(j)=[τ_m-M_j]_+ + [τ_l-L_j]_+ + [τ_o-O_j]_+</text>
  <text x="1022" y="1542" class="small">g_θ(o,j): teacher로부터 증류된 learned residual</text>
  <text x="1022" y="1572" class="small">tanh: residual이 과도하게 위험 후보를 뒤집지 못하도록 제한</text>
  <text x="1022" y="1602" class="small">G(j): 링크가 약하거나 다음 경로가 불안정할 때 부과되는 penalty</text>

  <!-- Row 3: risk switch -->
  <rect x="70" y="1730" width="790" height="530" rx="34" class="card"/>
  <text x="108" y="1780" class="section">5. Risk-Switch: 위험할 때만 branch 전환</text>
  <text x="110" y="1817" class="body">기본 후보 a_N을 그대로 쓰되, 링크 단절 위험이 크면 predictive 후보 a_P로 전환한다.</text>
  <rect x="110" y="1870" width="320" height="250" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="140" y="1914" class="h3">Normal branch</text>
  <text x="140" y="1952" class="small">Geo-Residual / Student가</text>
  <text x="140" y="1982" class="small">기본 next-hop a_N 선택</text>
  <text x="140" y="2036" class="formulaSmall">a_N = argmax z_N</text>
  <rect x="500" y="1870" width="320" height="250" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="530" y="1914" class="h3 orangeText">Predictive branch</text>
  <text x="530" y="1952" class="small">위험·유지확률·에너지 반영</text>
  <text x="530" y="1982" class="small">더 안전한 후보 a_P 선택</text>
  <text x="530" y="2036" class="formulaSmall">z_i^{P+}=z_i^P+λ_Eη_i</text>
  <path d="M430 1998 L492 1998" stroke="#f97316" stroke-width="6" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="120" y="2150" width="690" height="70" rx="22" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="150" y="2194" class="formulaSmall">S=1[a_N=DROP or D(a_N)&gt;τ or (a_P≠a_N and G(a_P,a_N)&gt;δ and D(a_P)&lt;D(a_N))]</text>

  <rect x="940" y="1730" width="790" height="530" rx="34" class="card"/>
  <text x="978" y="1780" class="section">6. 위험 점수와 안전 이득</text>
  <text x="980" y="1817" class="body">위험 조건을 위반한 정도를 더하고, predictive 후보가 충분히 안전할 때만 전환한다.</text>
  <rect x="990" y="1870" width="690" height="160" rx="24" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="1022" y="1914" class="h3 redText">위험 점수 D_i</text>
  <text x="1022" y="1952" class="formulaSmall">D_i=[g_m-m_i]_+ + [g_l-ℓ_i]_+ + [g_o-o_i]_+</text>
  <text x="1022" y="1984" class="formulaSmall">    + [g_k-ō_i,topk]_+ + 0.5[g_ρ-ρ_i]_+ + [g_p-p_keep]_+</text>
  <rect x="990" y="2064" width="330" height="135" rx="24" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
  <text x="1022" y="2106" class="h3 greenText">안전 점수 Q_i</text>
  <text x="1022" y="2150" class="formulaSmall">Q_i=m_i+ℓ_i+o_i+ō_i,topk</text>
  <text x="1022" y="2182" class="formulaSmall">    +0.5ρ_i+p_keep</text>
  <rect x="1350" y="2064" width="330" height="135" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1382" y="2106" class="h3 blueText">안전 이득</text>
  <text x="1382" y="2150" class="formulaSmall">G(a_P,a_N)</text>
  <text x="1382" y="2182" class="formulaSmall">= Q(a_P)-Q(a_N)</text>

  <!-- Row 4: algorithm and results -->
  <rect x="70" y="2310" width="790" height="150" rx="34" class="card"/>
  <text x="108" y="2362" class="section">7. 실행 알고리즘 요약</text>
  <text x="110" y="2401" class="body">후보 생성 → local feature 계산 → normal 후보 선택 → predictive 후보 선택 → 위험할 때만 switch</text>
  <path d="M160 2436 L780 2436" stroke="#2563eb" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <circle cx="175" cy="2436" r="18" fill="#2563eb"/><text x="168" y="2442" font-size="17" font-weight="800" fill="#fff">1</text>
  <circle cx="320" cy="2436" r="18" fill="#7c3aed"/><text x="313" y="2442" font-size="17" font-weight="800" fill="#fff">2</text>
  <circle cx="465" cy="2436" r="18" fill="#059669"/><text x="458" y="2442" font-size="17" font-weight="800" fill="#fff">3</text>
  <circle cx="610" cy="2436" r="18" fill="#f97316"/><text x="603" y="2442" font-size="17" font-weight="800" fill="#fff">4</text>
  <circle cx="755" cy="2436" r="18" fill="#e11d48"/><text x="748" y="2442" font-size="17" font-weight="800" fill="#fff">5</text>

  <rect x="940" y="2310" width="790" height="150" rx="34" class="card"/>
  <text x="978" y="2362" class="section">8. Phase12 full 결과로 본 현재 주장</text>
  <text x="980" y="2400" class="body">Risk-Switch Lite-GLOBE-P는 PDR·deadline이 높고, DRAMA/Evo-QGeo보다 입력 바이트가 낮다.</text>
  <rect x="990" y="2422" width="140" height="34" rx="17" fill="#dcfce7"/><text x="1012" y="2445" class="tiny greenText">PDR 0.905</text>
  <rect x="1148" y="2422" width="180" height="34" rx="17" fill="#dbeafe"/><text x="1173" y="2445" class="tiny blueText">Deadline 0.838</text>
  <rect x="1346" y="2422" width="190" height="34" rx="17" fill="#ffedd5"/><text x="1370" y="2445" class="tiny orangeText">vs DRAMA bytes -22.7%</text>
  <rect x="1555" y="2422" width="135" height="34" rx="17" fill="#fee2e2"/><text x="1577" y="2445" class="tiny redText">Energy 보완</text>
</svg>
