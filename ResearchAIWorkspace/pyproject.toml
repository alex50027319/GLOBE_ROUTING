[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-globe"
version = "0.1.0"
description = "Reproducible lightweight global-to-local FANET routing research code"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["torch>=2.4", "matplotlib>=3.10"]

[tool.setuptools.packages.find]
include = ["implementations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
