model:
  hidden_dim: 64

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  update_epochs: 4
  minibatch_size: 128
  max_grad_norm: 0.5

fine_tuning:
  updates: 20
  episodes_per_update: 32
  kd_lambda_initial: 0.0
  kd_decay_rate: 0.05
  kd_temperature: 1.0
  kd_batch_size: 128

runtime:
  device: auto
  seed: 42
